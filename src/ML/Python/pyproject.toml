[project]
name = "lots-pipeline"
version = "0.1.0"
description = "ML modeling layer for DirectIndexing tax-loss-harvesting project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "pyarrow>=15.0",   # optional faster CSV via pandas
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lots_pipeline"]
