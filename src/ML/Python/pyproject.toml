[project]
name = "directindexing-mlnet-renderer"
version = "0.1.0"
description = "Thin renderer for the ML.NET pipeline: reads JSON artifacts and emits PNGs + HTML."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]
